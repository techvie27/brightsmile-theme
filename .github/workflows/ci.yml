name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install packages
        run: composer install --no-progress

      - name: Check PHP syntax
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

      - name: Check coding standard
        run: vendor/bin/phpcs --standard=WordPress -n --ignore=vendor .

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build theme package
        run: |
          mkdir brightsmile-theme
          rsync -a --exclude=brightsmile-theme --exclude=.git --exclude=.github --exclude=vendor --exclude=composer.json --exclude=composer.lock --exclude=.gitignore --exclude=CONTRIBUTING.md ./ brightsmile-theme/
          zip -r brightsmile-theme.zip brightsmile-theme

      - name: Save package
        uses: actions/upload-artifact@v4
        with:
          name: brightsmile-theme-package
          path: brightsmile-theme.zip

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload theme to Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT" brightsmile-theme/ "$SSH_USER@$SSH_HOST:domains/dimgrey-termite-510880.hostingersite.com/public_html/wp-content/themes/brightsmile-theme/"